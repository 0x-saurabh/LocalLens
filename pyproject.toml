[project]
name = "locallens"
version = "0.1.0"
description = "Fully offline, privacy-first RAG over your PDFs, scans, tables and handwritten notes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pymupdf>=1.24",
    "lancedb>=0.15",
    "ollama>=0.4",
    "pydantic>=2.7",
    "tomli-w>=1.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
    "sentence-transformers>=3.0",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
tesseract = ["pytesseract>=0.3.10"]

[project.scripts]
locallens = "locallens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locallens"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
testpaths = ["tests"]
